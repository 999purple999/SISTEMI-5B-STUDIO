  .gloss-az a { padding: .35rem .65rem; background: rgba(0,240,255,0.06); border: 1px solid rgba(0,240,255,0.18); border-radius: 6px; color: var(--text-dim); font-family: 'JetBrains Mono', monospace; font-size: .85rem; text-decoration: none; transition: all .15s; }

  .gloss-az a.has { background: rgba(0,240,255,0.14); color: var(--neon-cyan,#00d9ff); }

  .gloss-search { display: block; width: 100%; max-width: 460px; margin: 1rem auto 1.5rem; padding: .75rem 1rem; background: rgba(0,240,255,0.06); border: 1px solid rgba(0,240,255,0.20); border-radius: 12px; color: var(--text); font-family: inherit; font-size: 1rem; outline: none; }
  .gloss-search:focus { border-color: var(--neon-cyan,#00d9ff); }
  .gloss-letter { margin-top: 2rem; }
  .gloss-letter h2 { font-family: var(--font-display, 'Chakra Petch', sans-serif); color: var(--neon-cyan,#00d9ff); font-size: 2rem; padding-bottom: .3rem; border-bottom: 1px solid rgba(0,240,255,0.18); }
  .gloss-term { padding: .8rem 1rem; margin: .5rem 0; background: rgba(8,10,30,0.4); border-left: 2px solid var(--neon-cyan,#00d9ff); border-radius: 0 8px 8px 0; }
  .gloss-term .word { font-weight: 700; color: var(--neon-pink,#ff2a6d); font-family: var(--font-display,'Chakra Petch',sans-serif); font-size: 1.05rem; letter-spacing: .02em; }
  .gloss-term .links { margin-top: .35rem; display:flex; flex-wrap:wrap; gap:.4rem; }
  .gloss-term .links a { font-size: .78rem; padding: 2px 8px; background: rgba(0,240,255,0.10); color: var(--text-dim); border-radius: 99px; text-decoration: none; }
  .gloss-term .links a:hover { color: var(--neon-cyan,#00d9ff); background: rgba(0,240,255,0.20); }
  .gloss-empty { text-align: center; padding: 3rem; color: var(--text-muted); }

<script>
(function(){
  // Estrai termini da <span class="term">…</span> di tutti i capitoli
  const terms = new Map(); // word → { occurrences: [{chapterId, slug, title, modulo}] }
  (window.MODULES||[]).forEach(mod => {
    mod.chapters.forEach(ch => {
      const data = (window.CHAPTERS||{})[ch.id];
      if (!data || !data.body) return;
      const re = /<span class="term">([^<]+)<\/span>/g;
      let m;
      while ((m = re.exec(data.body))) {
        const w = m[1].trim();
        if (!w || w.length < 2) continue;
        const key = w.toLowerCase();
        if (!terms.has(key)) terms.set(key, { word: w, occurrences: [] });
        const entry = terms.get(key);
        if (!entry.occurrences.find(o => o.chapterId === ch.id)) {
          entry.occurrences.push({ chapterId: ch.id, slug: ch.slug, title: ch.title, modulo: mod.num, color: mod.color });
        }
      }
    });
  });

  // Aggiungo anche le parole in <strong> dentro info-box key (heuristic per definizioni esplicite)
  (window.MODULES||[]).forEach(mod => {
    mod.chapters.forEach(ch => {
      const data = (window.CHAPTERS||{})[ch.id];
      if (!data || !data.body) return;
      const re = /info-box key[^>]*>[\s\S]*?<strong>([A-Z][A-Za-z0-9 ]{2,30})<\/strong>/g;
      let m;
      while ((m = re.exec(data.body))) {
        const w = m[1].trim();
        const key = w.toLowerCase();
        if (terms.has(key)) continue;
        terms.set(key, { word: w, occurrences: [{ chapterId: ch.id, slug: ch.slug, title: ch.title, modulo: mod.num, color: mod.color }] });
      }
    });
  });

  // Ordina alfabetico
  const sorted = [...terms.values()].sort((a,b) => a.word.localeCompare(b.word, 'it'));
  // Raggruppa per lettera
  const groups = {};
  for (const t of sorted) {
    let l = t.word[0].toUpperCase();
    if (!/[A-Z]/.test(l)) l = '#';
    if (!groups[l]) groups[l] = [];
    groups[l].push(t);
  }

  // A-Z
  const az = document.getElementById('gloss-az');
  const allLetters = '#ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
  az.innerHTML = allLetters.map(l => `<a href="#l-${l}" class="${groups[l]?'has':''}">${l}</a>`).join('');

  // Render
  const list = document.getElementById('gloss-list');
  function render(filter) {
    let html = '';
    for (const l of Object.keys(groups).sort((a,b) => a==='#'?1:b==='#'?-1:a.localeCompare(b))) {
      const items = groups[l].filter(t => !filter || t.word.toLowerCase().includes(filter.toLowerCase()));
      if (items.length === 0) continue;
      html += `<section class="gloss-letter" id="l-${l}"><h2>${l}</h2>`;
      for (const t of items) {
        html += `<div class="gloss-term">
          <span class="word">${t.word}</span>
          <div class="links">
            ${t.occurrences.slice(0,5).map(o => `<a href="${o.slug}.html" style="border:1px solid ${o.color}40; color:${o.color}cc;">${o.modulo} · ${o.title}</a>`).join('')}
          </div>
        </div>`;
      }
      html += '</section>';
    }
    list.innerHTML = html || '<div class="gloss-empty">Nessun termine corrisponde alla ricerca.</div>';
  }
  render('');
  document.getElementById('gloss-search').addEventListener('input', (e) => render(e.target.value));

  document.getElementById('nav-toggle').addEventListener('click', () => document.getElementById('nav-links').classList.toggle('open'));
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('../sw.js').catch(()=>{});
})();
</script>
